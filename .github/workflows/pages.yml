name: Publish UNITRAMP preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Extract and verify preview
        run: |
          unzip -q unitramp-classic-preview.zip -d _site
          base64 --decode unitramp-pages-65.tar.xz.b64 > "$RUNNER_TEMP/unitramp-pages.tar.xz"
          tar -xJf "$RUNNER_TEMP/unitramp-pages.tar.xz" -C _site
          test -s _site/index.html
          test "$(find _site -type f -name index.html | wc -l)" -eq 65
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
